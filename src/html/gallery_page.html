<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/reset.css" type="text/css">
    <link rel="stylesheet" href="../css/style.css" type="text/css">
    <title>Gallery</title>
</head>
<body>

    <!-- Cabeçalho padrão do site -->
    <header id="header" class="header">
        <img id="galo_logo" src="../../assets/images/Galo_BackGround_preto.png" alt="Logotipo Galo" width="100" height="100">
        <img id="globo_logo" src="../../assets/images/Globo.png" alt="Logotipo Globo" width="100" height="100">
        <img id="borboleta_logo" src="../../assets/images/Borboleta_Imagem_FubdoPreto.jpg" alt="Logotipo Galo" width="100" height="100"> 
    </header>

    <nav id="navigation_bar" class="nav">           
        <ul>
            <li><a href="home_page.html">
                <img id="home_icon" src="../../assets/images/Home.png" alt="Home" width="20" height="20"></a></li>
            <li><a href="music_page.html">
                <img id="music_icon" src="../../assets/images/Music.png" alt="Music" width="20" height="20"></a></li>
            <li><a href="register_page.html">
                <img id="register_icon" src="../../assets/images/Register.png" alt="Register" width="20" height="20"></a></li>
            <li><a href="gallery_page.html">
                <img id="library_icon" src="../../assets/images/Library.png" alt="Library" width="20" height="20"></a></li>
            <li><a href="contacts_page.html">
                <img id="contacts_icon" src="../../assets/images/Contacts.png" alt="Contacts" width="20" height="20"></a></li>
        </ul>
    </nav>

    <main>

        <!-- Conteudo da Pagina -->
        <section id="gallery_section">
            <h1 id="gallery_header">Gallery Images</h1>
            <div id="gallery_container">
                <button id="skip-back" class="gallery_button" type="button">
                    <img id="skip-back-image" src="../../assets/images/skip-back.png" alt="Skip back" width="18" height="18">
                </button>
                <img id="image_1" class="gallery_image" src="../../assets/images/CapaMusicas.jpeg" alt="Music Image">
                <img id="image_2" class="gallery_image" src="../../assets/images/CapaMusicas.jpeg" alt="Music Image">
                <img id="image_3" class="gallery_image" src="../../assets/images/CapaMusicas.jpeg" alt="Music Image">
                <button id="skip-forward" class="gallery_button" type="button">
                    <img id="skip-forward-image" src="../../assets/images/skip-forward.png" alt="Skip forward" width="18" height="18">
                </button>
            </div>
        </section>

    </main>

    <!-- Rodapé padrão da pagina -->
    <footer class="footer">
        <hr class="footer_line">
        <p><font color="white">© 2026 Igreja Evangélica Batista</font></p>
    </footer>

</body>
</html>
